name: Schedule Probe

# 临时诊断用：验证本仓库的 schedule 触发器是否能正常注册与到点触发。
# 结论确认后即可删除本文件。

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report
        run: |
          echo "probe fired at $(date -u '+%Y-%m-%d %H:%M:%S') UTC"
          echo "event=${{ github.event_name }}"
